# Настройки панели управления для Cloudflare Workers (деплой из GitHub).
name = "station-panel"
main = "worker/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

[vars]
GH_REPO = "EgorKuzznetsov/station-deutsch-factory"

[[kv_namespaces]]
binding = "KV"
id = "9aba35bf345d4635a0a210182295a462"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
