name: analytics
# Ежедневно собирает статистику YouTube/TikTok и пересчитывает веса форматов.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          FACTORY_URL: ${{ secrets.FACTORY_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -r requirements.txt
          python -m factory.main analytics
      - run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "analytics"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
